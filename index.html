<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maqueta Oficina 25 m²</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: escenario 3D a pantalla completa; rótulo de plano arriba a la izquierda, barra de controles abajo. */
  :root {
    color-scheme: light;
    box-sizing: border-box;
    --bg: #e9edf0;
    --surface: #f7f9fa;
    --surface-2: #e1e6ea;
    --fg: #1c2429;
    --muted: #55626b;
    --line: #c5cdd3;
    --accent: #0b6e8c;
    --accent-fg: #ffffff;
    --scene-bg: #e4e9ec;
    --dim: #0b6e8c;
    --sky: #a8cfea;
    --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --f-body: "Barlow", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171b; --surface: #1b2227; --surface-2: #28313a; --fg: #e6ebee; --muted: #94a1ab;
      --line: #36414a; --accent: #54c2de; --accent-fg: #06222b; --scene-bg: #141a1f; --dim: #54c2de; --sky: #1b2c40;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171b; --surface: #1b2227; --surface-2: #28313a; --fg: #e6ebee; --muted: #94a1ab;
    --line: #36414a; --accent: #54c2de; --accent-fg: #06222b; --scene-bg: #141a1f; --dim: #54c2de; --sky: #1b2c40;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 400 14px/1.4 var(--f-body); overflow: hidden;
  }
  .app { position: relative; height: 100%; overflow: hidden; background: var(--scene-bg); }
  .stage { position: absolute; inset: 0; }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
  /* Mapa: caja de 400 x 300 en la esquina superior derecha, solo con la vista Mapa */
  .mapview { position: absolute; top: 16px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(400px, calc(100% - 32px)); height: 300px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--fg); }
  .mapview[hidden] { display: none; }
  .mapview iframe { display: block; flex: 1 1 auto; width: 100%; min-height: 0; border: 0; background: #fff; }
  .mapfallback { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 14px; font: 400 12px/1.45 var(--f-body); color: var(--muted); }
  .mapfallback strong { font: 600 14px/1.2 var(--f-body); color: var(--fg); }
  .mapbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 10px; border-top: 1px solid var(--line); font: 500 11px/1.2 var(--f-mono); color: var(--muted); }
  .mapbar a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .mapbar a:hover { text-decoration: underline; }
  .tags { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .tag {
    position: absolute; left: 0; top: 0; white-space: nowrap;
    font: 500 11px/1 var(--f-mono); letter-spacing: .02em;
    padding: 4px 6px; background: var(--surface); color: var(--fg);
    border: 1px solid var(--line);
  }
  .tag.dim { color: var(--accent); border-color: var(--accent); font-weight: 500; }

  .hud {
    position: absolute; left: 0; right: 0; pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .hud-top { top: 0; padding-block: 16px 0; }
  .hud-bottom { bottom: 0; padding-block: 0 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }

  .rotulo { pointer-events: auto; width: max-content; max-width: 100%; background: var(--surface); border: 1px solid var(--fg); }
  .rotulo-head { padding: 8px 12px 8px; border-bottom: 1px solid var(--fg); }
  .rotulo h1 { margin: 0; font: 600 30px/1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; text-wrap: balance; }
  .rotulo .sub.loc { margin-top: 6px; color: var(--fg); font-weight: 500; }
  .rotulo .sub { margin: 4px 0 0; font: 400 11px/1.3 var(--f-mono); color: var(--muted); }
  .facts { margin: 0; display: grid; grid-template-columns: repeat(5, auto); gap: 1px; background: var(--line); }
  .facts > div { padding: 6px 12px 7px; min-width: 0; background: var(--surface); }
  .facts dt { font: 500 10px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .facts dd { margin: 2px 0 0; font: 500 22px/1 var(--f-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }

  .uibtn { pointer-events: auto; min-height: 28px; padding: 0 10px; font: 500 11px/1 var(--f-mono); letter-spacing: .04em; color: var(--muted); background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
  .uibtn:hover { color: var(--fg); border-color: var(--fg); }
  .uibtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ui-off .hud-top, .ui-off .panel, .ui-off .hint, .ui-off .mapview { display: none; }
  .hint { margin: 0; padding: 4px 8px; font: 400 11px/1.3 var(--f-mono); color: var(--muted); background: var(--surface); border: 1px solid var(--line); pointer-events: none; max-width: 100%; }
  /* Panel de controles: dos filas con etiqueta; cada fila tiene seis columnas iguales */
  .panel { pointer-events: auto; display: grid; grid-template-columns: 58px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--fg); width: min(640px, 100%); }
  .panel .lbl { display: flex; align-items: center; padding: 0 8px; font: 500 10px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-right: 1px solid var(--line); border-top: 1px solid var(--line); }
  .panel .lbl:first-child { border-top: 0; }
  .seg { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); min-width: 0; border-top: 1px solid var(--line); }
  .seg:nth-child(2) { border-top: 0; }
  .seg button {
    min-height: 40px; padding: 0 6px; border: 0; border-right: 1px solid var(--line);
    background: transparent; color: var(--fg); cursor: pointer;
    font: 500 13px/1 var(--f-body); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .seg button:last-child { border-right: 0; }
  .seg button.door { border-left: 1px solid var(--fg); }
  .seg button:hover { background: var(--surface-2); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .seg button[aria-pressed="true"]:focus-visible { outline-color: var(--accent-fg); }

  .stage canvas:focus { outline: none; }
  .pad {
    display: none; position: absolute; z-index: 5;
    right: max(16px, env(safe-area-inset-right, 0px)); bottom: 132px;
    grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 48px); gap: 4px;
  }
  .pad.on { display: grid; }
  .pad button {
    border: 1px solid var(--fg); background: var(--surface); color: var(--fg);
    font: 500 16px/1 var(--f-body); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .pad button:active { background: var(--accent); color: var(--accent-fg); }
  .pad button:nth-child(1) { grid-area: 1 / 2; }
  .pad button:nth-child(2) { grid-area: 2 / 1; }
  .pad button:nth-child(3) { grid-area: 2 / 2; }
  .pad button:nth-child(4) { grid-area: 2 / 3; }

  @media (max-width: 560px) {
    .rotulo h1 { font-size: 24px; }
    .facts { grid-template-columns: repeat(2, 1fr); }
    .facts > div:last-child { grid-column: 1 / -1; }
    .hint { display: none; }
    .panel { grid-template-columns: minmax(0, 1fr); }
    .panel .lbl { min-height: 22px; border-right: 0; }
    .seg { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .seg button { padding: 0 4px; font-size: 12px; border-top: 1px solid var(--line); }
    .seg button:nth-child(3n) { border-right: 0; }
    .seg button.door { border-left: 0; }
    .seg button:nth-child(-n+3) { border-top: 0; }
  }
</style>
</head>
<body>
<main class="app">
  <div id="stage" class="stage" role="img" aria-label="Maqueta 3D interactiva de una oficina de 25 metros cuadrados con hall común, dos baños y ascensor"></div>
  <div id="tags" class="tags" aria-hidden="true"></div>
  <div id="mapview" class="mapview" hidden>
    <iframe id="mapframe" title="Ubicación de la oficina en Google Maps" data-src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d836.0038417518851!2d-74.06256674269962!3d4.642719638114423!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e3f9a3909a9391b%3A0x414992eab0c2c520!2zQy4gNTZBICMgNy0xLCBDaGFwaW5lcm8sIEJvZ290w6EsIEQuQy4sIEJvZ290w6EsIEJvZ290w6EsIEQuQy4!5e0!3m2!1ses-419!2sco!4v1792648978989!5m2!1ses-419!2sco" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="mapbar"><span>Ak 7 con Cl. 57 · Chapinero</span><a href="https://www.google.com/maps/search/?api=1&amp;query=4.642719,-74.062567" target="_blank" rel="noopener">Abrir en Google Maps ↗</a></div>
  </div>

  <div class="hud hud-top">
    <header class="rotulo">
      <div class="rotulo-head">
        <h1>Oficina 25 m²</h1>
        <p class="sub loc">Ak 7 con Cl. 57 · Chapinero, Bogotá</p>
        <p class="sub">Automia · agencia de automatización · maqueta 3D · 6,00 × 4,20 × 2,50 m</p>
      </div>
      <dl class="facts">
        <div><dt>Construida</dt><dd>25 m²</dd></div>
        <div><dt>Privada</dt><dd>25 m²</dd></div>
        <div><dt>Estrato</dt><dd>4</dd></div>
        <div><dt>Baños</dt><dd>2</dd></div>
        <div><dt>Piso</dt><dd>5</dd></div>
      </dl>
    </header>
  </div>

  <div class="hud hud-bottom">
    <button type="button" id="t-ui" class="uibtn" aria-pressed="false" title="Atajo: H">Ocultar paneles</button>
    <p id="hint" class="hint"></p>
    <div class="panel" role="toolbar" aria-label="Controles de la maqueta">
      <div class="lbl">Vista</div>
      <div class="seg" role="group" aria-label="Vistas">
        <button type="button" id="v-iso" data-view="iso" aria-pressed="true">Isométrica</button>
        <button type="button" id="v-planta" data-view="planta" aria-pressed="false">Planta</button>
        <button type="button" id="v-ventanas" data-view="ventanas" aria-pressed="false">Ventanas</button>
        <button type="button" id="v-pizarra" data-view="pizarra" aria-pressed="false">Pizarra</button>
        <button type="button" id="v-logo" data-view="logo" aria-pressed="false">Logo</button>
        <button type="button" id="v-aerea" data-view="aerea" aria-pressed="false">Mapa</button>
      </div>
      <div class="lbl">Capas</div>
      <div class="seg" role="group" aria-label="Capas y puerta">
        <button type="button" id="t-ceiling" data-toggle="ceiling" aria-pressed="false">Techo</button>
        <button type="button" id="t-cut" data-toggle="cut" aria-pressed="true">Muros bajos</button>
        <button type="button" id="t-furniture" data-toggle="furniture" aria-pressed="true">Mobiliario</button>
        <button type="button" id="t-context" data-toggle="context" aria-pressed="false">Entorno</button>
        <button type="button" id="t-labels" data-toggle="labels" aria-pressed="true">Etiquetas</button>
        <button type="button" id="t-door" class="door" aria-pressed="true" title="Puerta abierta: clic para cerrarla">Puerta</button>
      </div>
    </div>
  </div>
  <div id="pad" class="pad" role="group" aria-label="Caminar">
    <button type="button" data-key="w" aria-label="Avanzar">&#9650;</button>
    <button type="button" data-key="left" aria-label="Girar a la izquierda">&#9664;</button>
    <button type="button" data-key="s" aria-label="Retroceder">&#9660;</button>
    <button type="button" data-key="right" aria-label="Girar a la derecha">&#9654;</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* Maqueta paramétrica de la oficina de 25 m².
   Unidades: metros. Eje Y hacia arriba. Norte = -Z. Origen = esquina noroeste interior de la oficina.
   Cambia las constantes de abajo para ajustar medidas. */
function buildOffice(THREE) {
  const W = 6.0, D = 4.2, H = 2.5, T = 0.12;      // oficina: ancho (x), fondo (z), alto, espesor de muro
  const HALL_D = 1.9, CORE_D = 2.0;                 // hall común y franja de baños/ascensor
  const ZH0 = D + T, ZH1 = ZH0 + HALL_D;            // hall: z de inicio y fin
  const ZC0 = ZH1 + T, ZC1 = ZC0 + CORE_D;          // baños y ascensor: z de inicio y fin

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = rng(25);

  const cache = {};
  function M(color, opts) {
    const key = color + JSON.stringify(opts || {});
    if (!cache[key]) cache[key] = new THREE.MeshStandardMaterial(Object.assign({ color: color, roughness: 0.85, metalness: 0 }, opts || {}));
    return cache[key];
  }
  function box(w, h, d, m, x, y, z, name, noShadow) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    mesh.position.set(x, y, z);
    if (name) mesh.name = name;
    mesh.castShadow = !noShadow;
    mesh.receiveShadow = true;
    return mesh;
  }
  function cyl(rt, rb, h, m, x, y, z, seg) {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 24), m);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }
  function group(name) { const g = new THREE.Group(); g.name = name; return g; }

  const M_WALL = M('#f2f3f4');
  const M_GLASS = M('#cfe8f2', { transparent: true, opacity: 0.2, roughness: 0.05, side: THREE.DoubleSide, depthWrite: false });
  const M_FRAME = M('#e9ecee', { roughness: 0.5 });
  const M_BLIND = M('#fbfbfb');
  const M_CHROME = M('#b9c0c6', { roughness: 0.35, metalness: 0.5 });
  let officeDoor = null;
  const DOOR_OPEN = 1.45;                           // ángulo de la puerta abierta (rad)

  /* ---------- Ventanas y puertas ---------- */
  function windowUnit(w, h, mullions, blind) {
    const g = group('ventana');
    const glass = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.01), M_GLASS);
    glass.name = 'vidrio';
    g.add(glass);
    g.add(box(w, 0.05, 0.08, M_FRAME, 0, h / 2 - 0.025, 0));
    g.add(box(w, 0.05, 0.08, M_FRAME, 0, -h / 2 + 0.025, 0));
    g.add(box(0.05, h, 0.08, M_FRAME, -w / 2 + 0.025, 0, 0));
    g.add(box(0.05, h, 0.08, M_FRAME, w / 2 - 0.025, 0, 0));
    mullions.forEach(function (mx) { g.add(box(0.04, h - 0.1, 0.06, M_FRAME, mx, 0, 0)); });
    g.add(box(w + 0.1, 0.04, T + 0.1, M_FRAME, 0, -h / 2 - 0.02, 0, 'repisa'));
    if (blind) g.add(box(w + 0.1, 0.13, 0.1, M_BLIND, 0, h / 2 + 0.1, T / 2 + 0.06, 'persiana'));
    return g;
  }

  function doorFrame(g, o, color, fc) {
    const w = o.u1 - o.u0, uc = (o.u0 + o.u1) / 2, hh = o.y1, m = M(color, { roughness: 0.7 });
    g.add(box(0.05, hh, T + 0.02, m, o.u0 + 0.025, hh / 2, fc));
    g.add(box(0.05, hh, T + 0.02, m, o.u1 - 0.025, hh / 2, fc));
    g.add(box(w, 0.05, T + 0.02, m, uc, hh - 0.025, fc));
  }

  function doorOffice(g, o, fc) {
    doorFrame(g, o, '#2b1c16', fc);
    const leafW = o.u1 - o.u0 - 0.06;
    const pivot = new THREE.Group();
    pivot.name = 'puerta oficina';
    pivot.position.set(o.u0 + 0.03, 1.03, fc);
    pivot.rotation.y = DOOR_OPEN;                    // abierta hacia el interior
    officeDoor = pivot;
    pivot.add(box(leafW, 2.06, 0.04, M('#4b2e22', { roughness: 0.6 }), leafW / 2, 0, 0));
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.025, 12, 12), M_CHROME);
    knob.position.set(leafW - 0.07, 0, 0.04);
    pivot.add(knob);
    g.add(pivot);
    // citófono junto a la puerta (cara interior)
    g.add(box(0.07, 0.2, 0.04, M('#e4dccb'), o.u0 - 0.2, 1.45, fc - T / 2 - 0.02, 'citofono'));
  }

  function doorBath(g, o, fc, female) {
    doorFrame(g, o, '#7f8885', fc);
    const w = o.u1 - o.u0 - 0.1, uc = (o.u0 + o.u1) / 2;
    g.add(box(w, 2.03, 0.04, M('#9fa8a5', { roughness: 0.4 }), uc, 1.015, fc));
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.025, 12, 12), M_CHROME);
    knob.position.set(uc + w / 2 - 0.08, 1.0, fc - 0.05);
    g.add(knob);
    const blue = M('#1f5fbf'), white = M('#ffffff');
    const sz = fc - 0.026;
    g.add(box(0.15, 0.15, 0.006, blue, uc, 1.55, sz, 'letrero', true));
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.017, 10, 10), white);
    head.position.set(uc, 1.6, sz - 0.006);
    g.add(head);
    if (female) {
      const dress = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.07, 12), white);
      dress.position.set(uc, 1.53, sz - 0.006);
      g.add(dress);
    } else {
      g.add(box(0.034, 0.065, 0.004, white, uc, 1.535, sz - 0.006, null, true));
    }
  }

  function doorElev(g, o, fc) {
    doorFrame(g, o, '#2f3438', fc);
    const w = o.u1 - o.u0, uc = (o.u0 + o.u1) / 2;
    g.add(box(w - 0.1, 2.03, 0.05, M('#1d2023'), uc, 1.015, fc + 0.005));
    const steel = M('#bcc4ca', { roughness: 0.3, metalness: 0.55 });
    const lw = (w - 0.1) / 2 - 0.005;
    g.add(box(lw, 2.03, 0.04, steel, uc - lw / 2 - 0.005, 1.015, fc - 0.01));
    g.add(box(lw, 2.03, 0.04, steel, uc + lw / 2 + 0.005, 1.015, fc - 0.01));
    g.add(box(0.08, 0.16, 0.02, steel, o.u1 + 0.14, 1.1, fc - T / 2 - 0.01, 'boton'));
  }

  /* ---------- Muros ---------- */
  const walls = group('muros');
  function wall(spec) {
    const g = group(spec.name);
    const ops = (spec.openings || []).map(function (o) {
      return Object.assign({}, o, { a: o.u0 - spec.u0, b: o.u1 - spec.u0 });
    }).sort(function (p, q) { return p.a - q.a; });
    const pieces = [];
    let cur = 0;
    ops.forEach(function (o) {
      if (o.a > cur + 1e-6) pieces.push([cur, o.a, 0, H]);
      if (o.y0 > 0) pieces.push([o.a, o.b, 0, o.y0]);
      if (o.y1 < H) pieces.push([o.a, o.b, o.y1, H]);
      cur = o.b;
    });
    if (cur < spec.len - 1e-6) pieces.push([cur, spec.len, 0, H]);
    const fc = spec.fixed + T / 2;
    pieces.forEach(function (p) {
      const w = p[1] - p[0], h = p[3] - p[2], uc = spec.u0 + (p[0] + p[1]) / 2, yc = (p[2] + p[3]) / 2;
      g.add(spec.axis === 'x' ? box(w, h, T, M_WALL, uc, yc, fc) : box(T, h, w, M_WALL, fc, yc, uc));
    });
    ops.forEach(function (o) {
      const uc = (o.u0 + o.u1) / 2, yc = (o.y0 + o.y1) / 2;
      if (o.type === 'window') {
        const wu = windowUnit(o.u1 - o.u0, o.y1 - o.y0, (o.mullions || []).map(function (m) { return m - uc; }), o.blind !== false);
        if (spec.axis === 'x') wu.position.set(uc, yc, fc);
        else { wu.position.set(fc, yc, uc); wu.rotation.y = -Math.PI / 2; }

  const R_PLAYER = 0.2;
  function canStand(x, z, doorAngle) {
    const r = R_PLAYER;
    const inR = function (q) { return x >= q.x0 + r && x <= q.x1 - r && z >= q.z0 + r && z <= q.z1 - r; };
    const inDoor = x >= 0.7 + r && x <= 1.6 - r && z >= D - r - 0.02 && z <= ZH0 + r + 0.02;

    for (let i = 0; collidersOn && i < colliders.rects.length; i++) {
      const q = colliders.rects[i];
      if (x > q[0] - r && x < q[2] + r && z > q[1] - r && z < q[3] + r) return false;
    }
    for (let i = 0; collidersOn && i < colliders.circles.length; i++) {
      const q = colliders.circles[i];
      if (Math.hypot(x - q[0], z - q[1]) < q[2] + r) return false;
    }

    for (let t = 0.12; t <= 1.001; t += 0.1) {
      if (Math.hypot(x - (hx + t * L * Math.cos(doorAngle)), z - (hz - t * L * Math.sin(doorAngle))) < 0.05 + r) return false;
    }
    return true;
  }

      pos = center.clone().add(dir.multiplyScalar(fitDistance(5.7, v.fov, a)));
      tgt = center.clone();
    } else if (name === 'planta') {
      var t = Math.tan(THREE.MathUtils.degToRad(v.fov) / 2);
      var dist = Math.max(5.1 / t, 3.75 / (t * a)) * 1.04;
      tgt = new THREE.Vector3(3.0, 0, 4.15);
      pos = new THREE.Vector3(3.0, dist, 4.151);
    } else if (name === 'aerea') {
      tgt = new THREE.Vector3(14, SYH, 6);
      pos = tgt.clone().add(new THREE.Vector3(10, 150, 38));
    } else {
      pos = new THREE.Vector3(v.pos[0], v.pos[1], v.pos[2]);
      var look = new THREE.Vector3(v.look[0], v.look[1], v.look[2]);
      tgt = pos.clone().add(look.sub(pos).normalize().multiplyScalar(0.05));
    }
    return { pos: pos, tgt: tgt, fov: v.fov };
  }
  function setLimits(mode, name) {
    if (mode === 'look') {
      controls.enableZoom = false; controls.enablePan = false;
      controls.minDistance = 0.001; controls.maxDistance = 1;
      controls.minPolarAngle = 0.25; controls.maxPolarAngle = Math.PI - 0.25;
      controls.rotateSpeed = -0.4;
    } else {
      controls.enableZoom = true; controls.enablePan = true;
      controls.minDistance = 3; controls.maxDistance = 260;
      controls.minPolarAngle = 0; controls.maxPolarAngle = Math.PI / 2 - 0.02;
      controls.rotateSpeed = 1;
    }
    state.walk = mode === 'look';
    syncWalkUI();
  }
  function openLimits() {
    controls.minDistance = 0.001; controls.maxDistance = 200;
    controls.minPolarAngle = 0; controls.maxPolarAngle = Math.PI;
  }

  function syncButtons() {
    ['iso', 'planta', 'ventanas', 'pizarra', 'logo', 'aerea'].forEach(function (k) {
      document.getElementById('v-' + k).setAttribute('aria-pressed', String(state.view === k));
    });
    ['ceiling', 'cut', 'furniture', 'context', 'labels'].forEach(function (k) {
      document.getElementById('t-' + k).setAttribute('aria-pressed', String(state[k]));
    });
  }
  function applyLayers() {
    model.ceiling.visible = state.ceiling;
    lamp.visible = state.ceiling;
    lamp2.visible = state.ceiling;
    model.setFurniture(state.furniture);
    applyBackground();
    model.context.visible = state.context;
    wallTarget = state.cut ? CUT : 1;
    cotas.visible = state.labels;
    tagsEl.style.display = state.labels ? '' : 'none';
    dirty = true;
  }

  var mapview = document.getElementById('mapview'), mapframe = document.getElementById('mapframe');
  function showMap(on) {
    if (on) {
      var r = document.querySelector('.rotulo').getBoundingClientRect(), sw = stage.clientWidth;
      var boxW = Math.min(400, sw - 32);
      var clash = r.right + 12 > sw - 16 - boxW;           // el rótulo no deja sitio al lado: bajar la caja
      var top = clash ? r.bottom + 12 : 16;
      var barTop = document.querySelector('.hud-bottom').getBoundingClientRect().top;
      mapview.style.top = top + 'px';
      mapview.style.height = Math.max(150, Math.min(300, barTop - top - 12)) + 'px';
      if (mapframe && !mapframe.getAttribute('src')) mapframe.setAttribute('src', mapframe.getAttribute('data-src'));
    }
    mapview.hidden = !on;
  }
  window.addEventListener('resize', function () { if (!mapview.hidden) showMap(true); });

  function setView(name, instant) {
    showMap(name === 'aerea');
    var v = views[name], pose = resolvePose(name);
    state.view = name;
    state.walk = false; keys = {}; syncWalkUI();
    state.ceiling = v.ceiling; state.cut = v.cut; state.context = v.context; state.labels = v.labels;
    applyLayers(); syncButtons();
    openLimits();
    var from = { pos: camera.position.clone(), tgt: controls.target.clone(), fov: camera.fov };
    var dur = (instant || reduce) ? 0 : 900, t0 = performance.now();
    flying = true;
    function finish() {
      camera.position.copy(pose.pos); controls.target.copy(pose.tgt);
      camera.fov = pose.fov; camera.updateProjectionMatrix();
      setLimits(v.mode, name);
      controls.update();
      flying = false; dirty = true;
    }
    if (dur === 0) { finish(); return; }
    function step(now) {
      if (state.view !== name) return;
      var k = Math.min(1, (now - t0) / dur);
      var e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      camera.position.lerpVectors(from.pos, pose.pos, e);
      controls.target.lerpVectors(from.tgt, pose.tgt, e);
      camera.fov = from.fov + (pose.fov - from.fov) * e;
      camera.updateProjectionMatrix();
      dirty = true;
      if (k < 1) requestAnimationFrame(step); else finish();
    }
    requestAnimationFrame(step);
  }

  document.querySelectorAll('[data-view]').forEach(function (b) {
    b.addEventListener('click', function () { setView(b.getAttribute('data-view')); });
  });
  document.querySelectorAll('[data-toggle]').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.getAttribute('data-toggle');
      state[k] = !state[k];
      if (reduce) { wallScale = state.cut ? CUT : 1; model.walls.scale.y = wallScale; model.logo.scale.y = 1 / wallScale; }
      applyLayers(); syncButtons();
    });
  });
  controls.addEventListener('change', function () { dirty = true; });

  /* ---- Mostrar u ocultar los paneles ---- */
  var appEl = document.querySelector('.app'), uiBtn = document.getElementById('t-ui');
  function toggleUI() {
    var off = !appEl.classList.contains('ui-off');
    appEl.classList.toggle('ui-off', off);
    uiBtn.textContent = off ? 'Mostrar paneles' : 'Ocultar paneles';
    uiBtn.setAttribute('aria-pressed', String(off));
    dirty = true;
  }
  uiBtn.addEventListener('click', toggleUI);

  /* ---- Puerta, caminata y teclado ---- */
  var doorOpen = true;
  var doorBtn = document.getElementById('t-door');
  var padEl = document.getElementById('pad');
  var keys = {};
  var Y_AXIS = new THREE.Vector3(0, 1, 0);

  function syncWalkUI() {
    padEl.classList.toggle('on', coarse && state.walk);
    hintEl.textContent = hints[state.walk ? 'look' : 'orbit'];
  }
  function syncDoor() {
    doorBtn.setAttribute('aria-pressed', String(doorOpen));
    doorBtn.textContent = 'Puerta';
    doorBtn.title = doorOpen ? 'Puerta abierta: clic para cerrarla' : 'Puerta cerrada: clic para abrirla';
  }
  function setPlayer(x, z) {
    var off = controls.target.clone().sub(camera.position);
    camera.position.x = x; camera.position.z = z;
    controls.target.copy(camera.position).add(off);
    dirty = true;
  }
  function toggleDoor() {
    doorOpen = !doorOpen;
    syncDoor();
    if (!doorOpen && state.walk && !model.canStand(camera.position.x, camera.position.z, 0)) {
      // quien está en el marco al cerrar se corre al lado más cercano
      setPlayer(camera.position.x, camera.position.z < 4.26 ? 3.65 : 4.82);
    }
    dirty = true;
  }
  doorBtn.addEventListener('click', toggleDoor);

  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), downAt = null;
  function hitDoor(ev) {
    var r = renderer.domElement.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    return ray.intersectObject(model.door, true).length > 0;
  }
  renderer.domElement.addEventListener('pointerdown', function (ev) {
    downAt = { x: ev.clientX, y: ev.clientY, t: performance.now() };
    renderer.domElement.focus({ preventScroll: true });
  });
  renderer.domElement.addEventListener('pointerup', function (ev) {
    if (!downAt) return;
    var moved = Math.hypot(ev.clientX - downAt.x, ev.clientY - downAt.y), dt = performance.now() - downAt.t;
    downAt = null;
    if (moved < 6 && dt < 500 && hitDoor(ev)) toggleDoor();
  });
  renderer.domElement.addEventListener('pointermove', function (ev) {
    if (ev.buttons) return;
    renderer.domElement.style.cursor = hitDoor(ev) ? 'pointer' : '';
  });

  var keyMap = { KeyW: 'w', ArrowUp: 'w', KeyS: 's', ArrowDown: 's', KeyA: 'a', KeyD: 'd',
    ArrowLeft: 'left', KeyQ: 'left', ArrowRight: 'right', KeyE: 'right', ShiftLeft: 'shift', ShiftRight: 'shift' };
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'KeyF') { if (!e.repeat) toggleDoor(); return; }
    if (e.code === 'KeyH') { if (!e.repeat) toggleUI(); return; }
    var k = keyMap[e.code];
    if (!k || !state.walk) return;
    keys[k] = true;
    e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { var k = keyMap[e.code]; if (k) keys[k] = false; });
  window.addEventListener('blur', function () { keys = {}; });
  padEl.querySelectorAll('button').forEach(function (b) {
    var k = b.getAttribute('data-key');
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); keys[k] = true; });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (n) { b.addEventListener(n, function () { keys[k] = false; }); });
  });

  function walkStep(dt) {
    if (!state.walk || flying) return;
    var f = (keys.w ? 1 : 0) - (keys.s ? 1 : 0), s = (keys.d ? 1 : 0) - (keys.a ? 1 : 0), t = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (!f && !s && !t) return;
    var off = controls.target.clone().sub(camera.position);
    if (t) off.applyAxisAngle(Y_AXIS, -t * 1.7 * dt);
    var fx = off.x, fz = off.z, len = Math.hypot(fx, fz) || 1;
    fx /= len; fz /= len;
    var mx = fx * f + (-fz) * s, mz = fz * f + fx * s, ml = Math.hypot(mx, mz);
    var px = camera.position.x, pz = camera.position.z;
    if (ml > 0) {
      var step = (keys.shift ? 2.6 : 1.5) * dt / Math.max(1, ml);
      var door = model.door.rotation.y;
      if (model.canStand(px + mx * step, pz, door)) px += mx * step;
      if (model.canStand(px, pz + mz * step, door)) pz += mz * step;
    }
    camera.position.x = px; camera.position.z = pz;
    controls.target.copy(camera.position).add(off);
    dirty = true;
  }

  /* ---- Tema ---- */
  var sceneBg = new THREE.Color('#e4e9ec'), skyCol = new THREE.Color('#a8cfea'), fog = new THREE.Fog('#a8cfea', 70, 360);
  function applyBackground() {
    renderer.setClearColor(state.context ? skyCol : sceneBg);
    scene.fog = state.context ? fog : null;
    catcher.visible = !state.context;
    dirty = true;
  }
  function readTheme() {
    var cs = getComputedStyle(document.documentElement);
    sceneBg.set((cs.getPropertyValue('--scene-bg') || '#e4e9ec').trim());
    skyCol.set((cs.getPropertyValue('--sky') || '#a8cfea').trim());
    fog.color.copy(skyCol);
    dimMat.color.set((cs.getPropertyValue('--dim') || '#0b6e8c').trim());
    applyBackground();
  }
  readTheme();
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', readTheme);

  /* ---- Tamaño ---- */
  var sized = false;
  function resize() {
    var w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    if (!sized) { sized = true; setView('iso', true); }
    dirty = true;
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();

  /* ---- Bucle ---- */
  var tmp = new THREE.Vector3();
  function updateTags() {
    if (!state.labels) return;
    var w = stage.clientWidth, h = stage.clientHeight;
    var far = camera.position.distanceTo(center) > 34;
    for (var i = 0; i < tags.length; i++) {
      var t = tags[i];
      tmp.copy(t.pos).project(camera);
      var out = tmp.z > 1 || Math.abs(tmp.x) > 1.1 || Math.abs(tmp.y) > 1.1 || (t.ctx && !state.context) || (t.furn && !state.furniture) || (!t.ctx && far) || (t.onlyFar && !far);
      t.el.style.display = out ? 'none' : '';
      if (!out) t.el.style.transform = 'translate(' + ((tmp.x * 0.5 + 0.5) * w).toFixed(1) + 'px,' + ((-tmp.y * 0.5 + 0.5) * h).toFixed(1) + 'px) translate(-50%,-50%)';
    }
  }
  var lastT = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    now = now || performance.now();
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    walkStep(dt);
    var doorTarget = doorOpen ? model.doorOpenAngle : 0, da = doorTarget - model.door.rotation.y;
    if (Math.abs(da) > 0.002) { model.door.rotation.y += reduce ? da : da * Math.min(1, dt * 7); dirty = true; }
    else if (da !== 0) { model.door.rotation.y = doorTarget; dirty = true; }
    var moved = controls.update();
    if (Math.abs(wallScale - wallTarget) > 0.002) {
      wallScale += (wallTarget - wallScale) * (reduce ? 1 : 0.14);
      model.walls.scale.y = wallScale; model.logo.scale.y = 1 / wallScale; dirty = true;
    } else if (wallScale !== wallTarget) {
      wallScale = wallTarget; model.walls.scale.y = wallScale; model.logo.scale.y = 1 / wallScale; dirty = true;
    }
    if (moved || dirty || flying) {
      renderer.render(scene, camera);
      updateTags();
      dirty = false;
    }
  }
  frame();
})();
</script>
</body>
</html>
